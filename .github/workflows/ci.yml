name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/inference/requirements.txt

      - name: Install dependencies
        run: pip install -r services/inference/requirements.txt

      - name: Test
        working-directory: services/inference
        run: pytest tests/ -v

      - name: Mock predict
        working-directory: services/inference
        run: python -m app.predict --mode mock --device cpu --output /tmp/result.json

      - name: API health (mock)
        working-directory: services/inference
        run: |
          python -c "from fastapi.testclient import TestClient; from app.api import app; r=TestClient(app).get('/health'); assert r.status_code==200"

  floor-plan-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt

      - name: Test
        working-directory: services/api
        run: pytest tests/ -v
