# Model registry — replaceable interfaces, versioned outputs
models_version: "v0-yolo11-layout"

walls:
  source: https://drive.google.com/drive/folders/1MgW3Qo-8K4OrHi4ebvYd-81cTqQxwLgz
  default_backend: mitunet
  backends:
    mitunet:
      weights: models/mitunet_walls.pth
      remote: https://media.githubusercontent.com/media/aliasstudio/mitunet/master/experiments/models/mitunet_finetune_a6_mit_b4_tversky_8864_28E.pth

room_types:
  name: architect-floorplan-cad
  weights: models/architect_floorplan.pt
  notes: Filter Architect YOLO to room / unit classes

objects:
  name: architect-floorplan-cad
  weights: models/architect_floorplan.pt
  notes: Filter Architect YOLO to doors, windows, stairs, lifts

structural:
  name: yolo11x-blueprint-layout-detector
  version: "yolo_layout"
  architecture: yolo11x-detect
  source: https://huggingface.co/GreenMap/yolo11x-blueprint-layout-detector
  weights: https://huggingface.co/GreenMap/yolo11x-blueprint-layout-detector/resolve/main/yolo_layout.pt
  classes:
    - drawing_area
    - legend_block
    - title_block

spatial:
  name: spatial_segmentation
  version: "0.0.0-mock"
  classes:
    - common_corridor
    - private_hall
    - common_lobby
    - room
    - service_space

entrance:
  name: entrance_classifier
  version: "0.0.0-mock"
  classes:
    - unit_entrance
    - internal_room_door
    - common_service_door
    - fire_exit
    - balcony_door
    - unknown

ocr:
  name: tesseract
  version: "0.0.0-mock"
  engine: tesseract
