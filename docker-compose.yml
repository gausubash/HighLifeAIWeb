# Local-only data plane. Do not use this file for Postgres.
# HighLife stores projects, auth, and PDFs in local Supabase (Docker on this machine).
#
#   npx supabase start     # Postgres + Auth + Storage on localhost
#   npx supabase stop      # stop containers (data stays in Docker volumes)
#   npm run dev:stack      # starts local Supabase, then inference + Next.js
#
# Nothing is sent to supabase.co unless you point NEXT_PUBLIC_SUPABASE_URL at a cloud project.
